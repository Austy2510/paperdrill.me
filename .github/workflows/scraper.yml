name: PaperDrill Scheduled Past-Paper Scraper

on:
  schedule:
    # Run at 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    # Allow manual execution from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/scraper/requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIMIT_PAPERS: 0 # Unlimited monthly run
        run: |
          cd apps/scraper
          python main.py run all
