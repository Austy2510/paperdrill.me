name: Scraper Cron Job

on:
  schedule:
    # Runs at 00:00 on the 1st of January and July (twice a year)
    - cron: '0 0 1 1,7 *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab anytime!

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'apps/scraper/requirements.txt'

      - name: Install system dependencies (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Scraper Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py run all
